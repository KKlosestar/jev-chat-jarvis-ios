name: Build IPA (for AltStore)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select newest Xcode (project needs Xcode 16 / objectVersion 77)
        run: |
          echo "=== Installed Xcodes ==="
          ls -d /Applications/Xcode*.app 2>/dev/null | sort -V
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild -project JevJarvis.xcodeproj -scheme JevJarvis \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 120

      - name: Embed entitlements (ldid, so App Group works after AltStore re-signs)
        run: |
          brew install ldid
          APP=$(find build -type d -name "JevJarvis.app" | head -1)
          test -n "$APP"
          echo "APP=$APP"
          ldid -S"App/JevJarvis.entitlements" "$APP/JevJarvis"
          ldid -S"Keyboard/JevKeyboard.entitlements" "$APP/PlugIns/JevKeyboard.appex/JevKeyboard"
          echo "--- App entitlements ---"
          ldid -e "$APP/JevJarvis"
          echo "--- Keyboard entitlements ---"
          ldid -e "$APP/PlugIns/JevKeyboard.appex/JevKeyboard"

      - name: Package IPA
        run: |
          APP=$(find build -type d -name "JevJarvis.app" | head -1)
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry JevJarvis.ipa Payload
          ls -lh JevJarvis.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-ipa
          path: JevJarvis.ipa
          retention-days: 14
